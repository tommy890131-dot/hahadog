name: V3.11 unpack source on development branch
on:
  workflow_dispatch:
  push:
    branches:
      - feature/v3.11-survival
    paths:
      - .github/workflows/v311-unpack.yml
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract verified original sources
        run: node bootstrap.mjs
      - name: Verify extracted sources
        shell: bash
        run: |
          set -euo pipefail
          for path in server.mjs server/NavigationWorker.mjs scripts/render-build.sh apps/client/src/main.ts tests/physics-security-regression.test.mjs; do
            test -f "$path" || { echo "::error::Missing extracted $path"; exit 1; }
          done
          echo "All essential game sources extracted"
      - name: Commit extracted sources only on development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          added=0
          for path in server.mjs server scripts apps tests packages public package.json package-lock.json; do
            if [[ -e "$path" ]]; then
              git add -f -A -- "$path"
              added=$((added + 1))
            fi
          done
          if [[ "$added" -lt 4 ]]; then
            echo "::error::Too few source paths were staged"
            exit 1
          fi
          echo "Staged source paths: $added"
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "::error::No extracted sources staged: check ignore rules, archive layout and existing commits"
            exit 1
          fi
          git commit -m "build(v3.11): unpack verified V3.9.2 game source"
          git push origin HEAD:feature/v3.11-survival
