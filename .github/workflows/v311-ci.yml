name: V3.11 game integration verification
on:
  push:
    branches: [feature/v3.11-survival]
    paths-ignore:
      - 'v311/ci-report.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v311-integration
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify extracted source present
        run: |
          test -f server.mjs
          test -f server/NavigationWorker.mjs
          test -f apps/client/src/main.ts
          test -f v311/GameplaySystems.mjs
      - name: Install dependencies and generate assets
        run: |
          npm install --include=dev --workspaces --no-audit --no-fund
          node scripts/copy-draco.mjs
          node scripts/generate-sfx.mjs
          node scripts/restore-enemy-assets.mjs
          npm run build:nav
      - name: Verify V3.11 rules
        id: rules
        continue-on-error: true
        run: |
          set -o pipefail
          node --test v311/*.test.mjs 2>&1 | tee v311-rules.log
      - name: Compile TypeScript and bundle game
        id: types
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee v311-build.log
      - name: Run full existing game tests
        id: legacy
        continue-on-error: true
        run: |
          set -o pipefail
          NODE_ENV=test npm test 2>&1 | tee v311-legacy.log
      - name: Publish branch-only verification report
        if: ${{ !cancelled() && steps.rules.outcome != 'skipped' && steps.types.outcome != 'skipped' && steps.legacy.outcome != 'skipped' }}
        run: |
          mkdir -p v311
          {
            echo "# V3.11 CI report"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Rules: ${{ steps.rules.outcome }}"
            echo "TypeScript/Vite: ${{ steps.types.outcome }}"
            echo "Existing game regression: ${{ steps.legacy.outcome }}"
            echo ""
            echo "## Build output (tail)"
            echo '~~~'
            tail -n 30 v311-build.log 2>/dev/null || true
            echo '~~~'
            echo "## Gameplay rules (tail)"
            echo '~~~'
            tail -n 15 v311-rules.log 2>/dev/null || true
            echo '~~~'
            echo "## Regression test output (tail)"
            echo '~~~'
            grep -A 25 -B 2 '^not ok' v311-legacy.log 2>/dev/null || true
            tail -n 20 v311-legacy.log 2>/dev/null || true
            echo '~~~'
          } > v311/ci-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v311/ci-report.md
          git commit -m "ci(v3.11): publish verified branch test report" || exit 0
          git pull --rebase origin feature/v3.11-survival
          git push origin HEAD:feature/v3.11-survival
      - name: Fail if validation is incomplete
        if: always()
        run: |
          test "${{ steps.rules.outcome }}" = success
          test "${{ steps.types.outcome }}" = success
          test "${{ steps.legacy.outcome }}" = success
